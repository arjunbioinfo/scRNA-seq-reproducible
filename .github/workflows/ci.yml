name: CI

# Runs the pipeline end-to-end on the bundled example dataset (3k PBMCs)
# on every push / PR, proving the environment and workflow are reproducible.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline on example dataset
        run: |
          python scrna_pipeline.py --config config/config.yaml
          echo "----- cluster sizes -----"
          cat results/cluster_sizes.csv

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-outputs
          path: |
            figures/*.png
            results/*.csv
          if-no-files-found: warn
